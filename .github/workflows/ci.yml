name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.14"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Write private guard policy from secret
        env:
          TERMS: ${{ secrets.PUBLIC_GUARD_TERMS }}
        run: |
          umask 077
          printf '%s\n' "$TERMS" > "$RUNNER_TEMP/public_blocked_terms.txt"
          while IFS= read -r line; do
            line="${line%$'\r'}"; term="${line#"${line%%[![:space:]]*}"}"; term="${term%"${term##*[![:space:]]}"}"
            case "$term" in ''|'#'*) continue ;; esac
            for form in "$term" "${term,,}" "${term^^}"; do echo "::add-mask::$form"; done
          done < "$RUNNER_TEMP/public_blocked_terms.txt"
          echo "PUBLIC_GUARD_TERMS=$RUNNER_TEMP/public_blocked_terms.txt" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -q
      - name: Check for private paths and internal wording
        run: python scripts/leak_check.py
      - name: Check every notebook
        shell: bash
        run: |
          find notebooks -name '*.ipynb' -print0 | sort -z | while IFS= read -r -d '' notebook; do
            python scripts/check_notebook.py "$notebook"
          done
      - name: Check deterministic rebuild
        run: |
          python scripts/rebuild.py
          git diff --exit-code